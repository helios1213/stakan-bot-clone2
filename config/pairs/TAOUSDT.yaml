# TAOUSDT — SELF-CONTAINED config (all fields explicit; no global.yaml inheritance).
# Materialized from the effective runtime config. Edit here directly per-pair.

meta:
  symbol: TAOUSDT
  behavioral_epoch: 1785847061
  note: behavioral_epoch = unix time the TUNING last changed; bump ONLY on a real
    config change, NOT on re-materialization. Analyze only trades with opened_at >=
    this.
detector:
  min_ticks: 5
  cooldown_sec: 3.0
  long_only: false
  short_only: false
  # Спред-кеп у ТІКАХ (2026-08-04). Був max_spread_bps: 2.0 — bps-поріг на
  # величині, квантованій цілими тіками ($0.01), тож реальне правило «≤N тіків»
  # стрибало сходинками з ціною: <$150 → ≤2т, $191 → ≤3т, >$200 → ≤4т, >$250 → ≤5т.
  # Обриви арифметично певні (реконструкція з 49 589 рядків signal_features
  # відхиляється від цілого ≤0.001 тіка). Сьогодні ворота ріжуть 1 441 з 6 600
  # кандидатів (21.8%); падіння ціни на 22% забрало б 41-53% — без правки конфігу.
  # 3 = поведінково тотожно сьогоднішнім 2.0 bps при $191. Прямого доказу шкоди
  # від дрейфу НЕМАЄ (єдиний зсув сходинки, n=292 при $200-201.71, був плюсовий),
  # тож це фіксація механізму, не заробіток. Revert = ticks 0.0 + bps 2.0
  max_spread_ticks: 3
  max_spread_bps: 0.0
  # Підлога по МІД-гепу в тіках, дзеркало основи. min_ticks читає
  # одностороннiй геп котирувань = це плюс (mexc_spread-binance_spread)/2,
  # тож 3-тікова книга проносить 4-тікове зміщення через 5-тіковий гейт.
  # Когорта 4.0t: 18.2% потоку, -$29.80, WR 38%, DOA 51%; 4.5/5.0/6.0t
  # дають +0.100/+0.281/+0.625 bps і DOA падає до 30%. 4.25 стоїть у
  # порожнечі: жодної угоди в межах +/-0.2 тіка. Revert=0.0
  min_mid_gap_ticks: 4.25   # Revert=0.0
exit_strategy:
  min_hold_ms: 500
  stop_adverse_bps: 10.0
  trail_distance_bps: 3.0
  breakeven_trigger_bps: 5.0
  stall_timeout_ms: 3000
  dead_on_arrival_timeout_ms: 2500
  nevergreen_cut_ms: 900
  nevergreen_adverse_ticks: 3.0
  nevergreen_peak_ticks: 1.0
  binance_reversal_max_ms: 1500
execution:
  ioc_offset_ticks: 2
  ioc_max_attempts: 1
  ioc_attempt_interval_ms: 0
  # ⚠️ ФОЛБЕК, не істина. Розмір живої угоди задає таблиця slot_pair_sizing
  # (slot_id, symbol) — вона виграє над цими чотирма ключами БЕЗУМОВНО.
  # Редагувати розмір тут = no-op для будь-якого слота, у якого є рядок.
  # Ці числа діють ЛИШЕ якщо рядок видалити (кнопка «↺ reset»), тому вони
  # дорівнюють МІНІМУМУ по слотах — скидання не може підняти експозицію.
  # Знімок slot_pair_sizing (може змінитись без правки цього файлу): слот 1: 23-26 × 45-50
  margin_min_usdt: 23
  margin_max_usdt: 26
  leverage_min: 45
  leverage_max: 50
  stop_loss_ticks: 6
  sl_grace_sec: 1.5
  max_hold_sec: 60
  cooldown_after_loss_sec: 3
  cooldown_after_win_sec: 2
  binance_reversal_ticks: 0.0   # 2026-07-14 DISABLED (mirror of primary; workflow 101%-verified +$4.4/day). Revert=15.0
  gap_retrace_frac: 0.0
  # 2026-08-04: ПРИБРАНО (був 0.02). Дубль detector.min_mid_gap_ticks 4.25
  # у гірших одиницях: тік TAO = $0.01, тож у тіках цей поріг = 0.02·price
  # і вище $212.50 він перехоплював владу в тікового, починаючи різати
  # прибуткову когорту 4.5t. При ціні нижче $212.50 видалення нейтральне.
  # Не вмикати назад — гейтити мід-геп тільки в тіках.
  min_mexc_lag_pct: 0.0
