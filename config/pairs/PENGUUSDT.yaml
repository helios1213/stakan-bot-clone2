# PENGUUSDT — SELF-CONTAINED config (all fields explicit; no global.yaml inheritance).
# Materialized from the effective runtime config. Edit here directly per-pair.

meta:
  symbol: PENGUUSDT
  behavioral_epoch: 1785776934
  note: behavioral_epoch = unix time the TUNING last changed; bump ONLY on a real
    config change, NOT on re-materialization. Analyze only trades with opened_at >=
    this.
detector:
  min_ticks: 3
  cooldown_sec: 2.0
  long_only: false
  short_only: false
  max_spread_bps: 0.0
  # 2026-07-28: floor on the BINANCE<->MEXC MID gap, in ticks. min_ticks reads
  # the same-side quote gap, so with the spread gate off a wide MEXC book
  # carries a 2-tick dislocation over this 3-tick gate. Measured on 1,082 live
  # trades over 14 days: 1.5t loses $16.09 at WR 3% / DOA 81%, 2.0t loses $13.80
  # at WR 16% / DOA 73%, while 3.0t earns $144.03 at WR 78% / DOA 20%. Cutting
  # below 2.25 costs 8.4% of the flow and adds $42.67 (+41% of the pair's PnL);
  # best threshold on the 7d, 14d and 30d windows alike. 2.75 is worse — it also
  # cuts the mildly profitable 2.5t cohort. Ticks not bps: PENGU's price moved
  # 0.008 -> 0.006 in this window, which shifts a bps floor across cohorts.
  # Revert=0.0
  min_mid_gap_ticks: 2.25
  # 2026-08-03: floor on the EXECUTABLE edge, in ticks. The detector already
  # computes it and only logged it:
  #   exec_buy  = (binance_bid - mexc_ask)/tick,  exec_sell mirrored.
  # Both spreads are inside it, so this is the dislocation net of the cost of
  # reaching the touch — min_ticks and min_mid_gap_ticks subtract neither, so a
  # real gap through a wide MEXC book passes both and still cannot win.
  # Verified in two regimes: primary pre-offset n=217 (exec-1 -7.06, exec0 -1.33,
  # exec1 +1.52, exec2 +2.22 bps) and clone with offset 1 n=113 (exec0 -1.66,
  # exec1 -0.42, exec2 +0.74). Cutting exec<=0 costs 8-18% of fills and moves
  # +0.841 -> +1.680 bps / -0.050 -> +0.329 bps.
  # 0.5 sits in empty space: the distribution is integer-tick, zero trades
  # within +/-0.26. NOT 1.5 — exec=1 earns +1.52 on the primary and is 38% of
  # the flow; whether the offset eats that level is a live question now.
  # Revert=0.0
  min_exec_ticks: 0.5
exit_strategy:
  min_hold_ms: 500
  stop_adverse_bps: 10.0
  trail_distance_bps: 3.0
  breakeven_trigger_bps: 5.0
  stall_timeout_ms: 3000
  dead_on_arrival_timeout_ms: 4000
  nevergreen_cut_ms: 0
  nevergreen_adverse_ticks: 4.0
  nevergreen_peak_ticks: 1.0
  binance_reversal_max_ms: 1500
execution:
  # 2026-07-29: cross by one tick. At-touch filled only 34% live (1202 of
  # 3508 attempts, 1804 ioc_expired_no_fill) while signal_features called
  # 84% of gate-passing signals fillable — the 2.5x gap is the touch moving
  # inside our ~150ms submit. Cost is bounded: an IOC still matches the best
  # resting level, so the extra tick is only paid when the touch has already
  # moved. WATCH IT: PENGU tick = 1.622 bps against a +1.399 bps edge, so a
  # converted trade that really pays a full tick is net negative. Revert=0
  ioc_offset_ticks: 1
  ioc_max_attempts: 1
  ioc_attempt_interval_ms: 0
  # ⚠️ ФОЛБЕК, не істина. Розмір живої угоди задає таблиця slot_pair_sizing
  # (slot_id, symbol) — вона виграє над цими чотирма ключами БЕЗУМОВНО.
  # Редагувати розмір тут = no-op для будь-якого слота, у якого є рядок.
  # Ці числа діють ЛИШЕ якщо рядок видалити (кнопка «↺ reset»), тому вони
  # дорівнюють МІНІМУМУ по слотах — скидання не може підняти експозицію.
  # Знімок slot_pair_sizing (може змінитись без правки цього файлу): слот 1: 45-50 × 45-50
  margin_min_usdt: 45
  margin_max_usdt: 50
  leverage_min: 45
  leverage_max: 50
  stop_loss_ticks: 5
  sl_grace_sec: 1.5
  max_hold_sec: 60
  cooldown_after_loss_sec: 3
  cooldown_after_win_sec: 2
  binance_reversal_ticks: 15.0
  gap_retrace_frac: 0.0
  momentum_filter: false
  momentum_tau_sec: 2.0
  momentum_threshold_bps: 2.0
  min_mexc_lag_pct: 0.0
