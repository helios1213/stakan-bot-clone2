# 1000PEPEUSDT — SELF-CONTAINED config (all fields explicit; no global.yaml inheritance).
# Materialized from the effective runtime config. Edit here directly per-pair.

meta:
  symbol: 1000PEPEUSDT
  behavioral_epoch: 1785794816
  note: behavioral_epoch = unix time the TUNING last changed; bump ONLY on a real
    config change, NOT on re-materialization. Analyze only trades with opened_at >=
    this.
detector:
  min_ticks: 5
  cooldown_sec: 2.0
  long_only: false
  short_only: false
  max_spread_bps: 1.3
  # Вхідні ворота по мід-гепу — у ТІКАХ, не в bps (2026-08-04).
  # Раніше це були execution.min/max_mexc_lag_pct 0.013/0.02, тобто
  # поріг у bps на інструменті з фіксованим тіком: у тіках він плив із
  # ціною (0.00360 → [4.68t, 7.19t]; 0.00295 → [3.83t, 5.90t]) і різав
  # поперек пів-тікових когорт, а не між ними.
  # 11 258 угод поточної епохи: 4.0t −$273.68 (−0.392 bps, WR 34.9%,
  # мінусова 6 із 6 повних днів, nevergreen_cut = 43.6% її виходів);
  # 4.5t +$34.09; 5.0t +$845.01 (+0.555, WR 54.2%); 5.5t +$1.93.
  # Потолок 5.5 інертний сьогодні — фіксує статус-кво, щоб +2% по ціні
  # не завели неміряну 6.0t (у попередній епосі −$108.88, WR 32.2%).
  min_mid_gap_ticks: 4.5
  max_mid_gap_ticks: 5.5
exit_strategy:
  min_hold_ms: 500
  stop_adverse_bps: 10.0
  trail_distance_bps: 5.0
  breakeven_trigger_bps: 5.0
  stall_timeout_ms: 3000
  dead_on_arrival_timeout_ms: 3000
  nevergreen_cut_ms: 900
  nevergreen_adverse_ticks: 4.0
  nevergreen_peak_ticks: 1.0
  binance_reversal_max_ms: 1500
execution:
  ioc_offset_ticks: 2
  ioc_max_attempts: 1
  ioc_attempt_interval_ms: 0
  # ⚠️ ФОЛБЕК, не істина. Розмір живої угоди задає таблиця slot_pair_sizing
  # (slot_id, symbol) — вона виграє над цими чотирма ключами БЕЗУМОВНО.
  # Редагувати розмір тут = no-op для будь-якого слота, у якого є рядок.
  # Ці числа діють ЛИШЕ якщо рядок видалити (кнопка «↺ reset»), тому вони
  # дорівнюють МІНІМУМУ по слотах — скидання не може підняти експозицію.
  # Знімок slot_pair_sizing (може змінитись без правки цього файлу): слот 1: 65-70 × 45-50; слот 2: 45-50 × 65-70
  margin_min_usdt: 45
  margin_max_usdt: 50
  leverage_min: 45
  leverage_max: 50
  stop_loss_ticks: 8
  sl_grace_sec: 1.5
  max_hold_sec: 60
  cooldown_after_loss_sec: 3
  cooldown_after_win_sec: 2
  binance_reversal_ticks: 0.0
  gap_retrace_frac: 0.0
  momentum_filter: false
  momentum_tau_sec: 2.0
  momentum_threshold_bps: 2.0
  # Замінені на detector.min/max_mid_gap_ticks — та сама величина, але в
  # тіках. 0 = вимкнено; не вмикати назад, це дубль у гірших одиницях.
  min_mexc_lag_pct: 0.0
  max_mexc_lag_pct: 0.0