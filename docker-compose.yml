
services:
  stakan-bot:
    build: .
    container_name: stakan-bot
    # ГРЕЙС НА ЗУПИНКУ. Дефолт docker — 10с, і цього НЕ ВИСТАЧАЄ: дренаж
    # прогріву при відкритій позиції читає реалізований PnL із ретраями
    # (1.5+3.0+4.5 = 9.0с сну), а reconcile_pending має власні 9.0с у тому
    # самому вікні. SIGKILL посеред дренажу лишав фантомний запис на диску і
    # дірку в обліку кампанії. 60с дають дренажу вдосталь запасу.
    stop_grace_period: 60s
    restart: unless-stopped
    dns:
      - 108.61.10.10   # Vultr Tokyo resolver -> Akamai 23.56.0.x fast POP (~0.5ms)
      - 8.8.8.8         # Google fallback -> fast Tokyo POP (replaces Quad9 89ms far POP)
    env_file: .env
    environment:
      - TZ=Europe/Kyiv
      # Тримати однаковим з primary: 3.0 виявився налаштованим під більший
      # сплеск, ніж буває — за 3 доби до 2026-08-21 спрацював НУЛЬ разів і
      # проґавив прогін SOXL на +$147.78 (пік x2.70 від медіани пари).
      - BURST_RATE_MULT=2.25
      # Вікно 300с не давало алерту прийти раніше ніж через 5 хв після початку
      # сплеску. Реплей за 3 доби: 180с -> перший алерт на 7 хв раніше, усі 5
      # спрацювань перед прибутковими наступними 10 хв. 60с НЕ брати — там
      # 16 алертів, 88% прибуткових і перший збитковий.
      - BURST_WIN_SEC=180
      # 2026-08-21 друге калібрування: перше давало алерти на $1.9-2.8 за 3 хв.
      # Помилка була в метриці — «чи був прибуток» замість «чи вартий дії»
      # (вартими були 19%). Фільтр розмір-незалежний: кількість угод у вікні
      # як міра суттєвості. Реплей: 21 алерт/19% -> 8 алертів/88% вартих.
      - BURST_MIN_TRADES=10
      - BURST_BPS_ABS=3.0
      - BURST_BPS_MULT=3.0
      # Тривалість — головна знахідка: bps не відділяє аномалію від шуму,
      # розділяє те, чи рух ТРИМАЄТЬСЯ. Усі фейкові алерти були одним вікном.
      - BURST_PERSIST_SEC=180
      - BURST_BPS_SUSTAIN=2.0
      # Вердикт «протух» ухвалюється на ~0.9с, а перше перечитування було на
      # 2.5с — 1.6с реальна позиція без нагляду. Вікно 1.2с скорочує це до 0.3с.
      - PHANTOM_FILL_CHECK_DELAYS_SEC=1.2,2.5,6,12
      # Скільки слот лишається на пейсингу 1 відкриття / 65с після відмови
      # 9082. Було 21600 (6 год) — не з даних, а зі стелі.
      # ВИМІРЯНО 2026-08-21 по слоту 2 (n=3372 відмови, слоти рахувати ОКРЕМО:
      # ліміт per-account, змішування слотів робить із різкої межі шум):
      #   вікно ліміту = РІВНО 60с. Відмови при розривах 55-60с, при 61с і
      #   далі — НУЛЬ із 3372. HOLD=65с стоїть рівно над межею, не чіпати.
      #   лічильник іде від останнього УСПІШНОГО відкриття; відмова його НЕ
      #   скидає (56% успіхів після відмови лягають на 60-70с від успіху).
      #   ліміт НЕ завжди активний: 91.7% відкриттів слота 2 мають розрив
      #   <60с, у 42 різних днях. Він вмикається епізодами.
      #   тривалість епізодів: 4.9 / 9.1 / 28.3 / 57.5 / 140.2 хв.
      # 3600 покриває медіанний епізод (57.5 хв). Якщо обмеження ще діє —
      # прилетить друга відмова і латч зведеться наново, тобто помилка в
      # менший бік самовиправляється, а в більший — коштує годин торгівлі
      # (21.08: одна відмова о 17:16 залатчила слот до 23:16).
      - OPEN_THROTTLE_MODE_SEC=3600
      # Посів профілю пристрою — див. коментар на primary. Значення МУСИТЬ
      # відрізнятись від нього, інакше слот 1 обох ботів виглядав би одним ПК.
      - MEXC_DEVICE_SEED=clone1-vultr-45.76.96.241
      # ЯВНИЙ зсув — див. коментар на primary. primary=0, клон=2: при двох
      # слотах на машину профілі не можуть перекритись за побудовою.
      - MEXC_DEVICE_OFFSET=2
      # Режим шляху ордера — див. коментар на primary. full | bare.
      - MEXC_PATH_MODE=bare
      # ⚠️ ЖИВІ ГРОШІ. Другий із ДВОХ незалежних гейтів прогріву: кнопка 🌱 у
      # /slot N вмикає прогрів для слота, але без цієї змінної раннер лишається
      # у DRY-RUN і не відправляє НІЧОГО.
      # Читається ОДИН РАЗ на старті (soft_start_runner: dry_run =
      # not live_allowed()), тож перемикається тільки через up -d.
      # Порядок: спершу змінна + рестарт, ПОТІМ кнопка.
      # Слот 1 цього бота — акаунт БЕЗ промо (усі 24 пари maker=0.0001,
      # taker=0.0004, перевірено 2026-08-26 через src._fee_audit). Тобто саме
      # тут працює нова гілка: 0% немає -> гріємо найдешевшу платну, а комісія
      # списується у бюджет. Під старим правилом zero_both прогрів тут не
      # зробив би жодного ордера.
      # Стеля витрат 5 USDT на слот, кампанія 3 дні і вимикає себе сама.
      - SOFT_START_LIVE=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; exit(0 if time.time()-os.path.getmtime('/app/data/.heartbeat')<60 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Tune for many WebSocket connections
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
